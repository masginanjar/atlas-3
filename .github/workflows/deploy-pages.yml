# Deploy otomatis ke GitHub Pages setiap ada perubahan di branch main.
# Mode LIVE (Supabase) — kunci di bawah adalah publishable key (aman untuk browser).
name: Deploy ATLAS Alfa (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build (live)
        run: npm run build:live
        env:
          VITE_BASE: ./
          VITE_MASK_PII: "1"
          VITE_SUPABASE_URL: https://cdeiirdxrxogspqmesik.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_wvCWE64SK9COIBVaSOLD3Q_aQo2I1wM
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Bila sumber Pages masih "Deploy from a branch", GitHub juga menerbitkan kode mentah (layar putih).
      # Tunda agar deploy hasil build ini selalu yang terakhir menang.
      - run: sleep 150
      - id: deployment
        uses: actions/deploy-pages@v4
